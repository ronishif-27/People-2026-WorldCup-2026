# nginx config for the World Cup 2026 frontend on Cloud Run.
#
# Two non-obvious requirements:
#   1. SPA fallback — React Router uses BrowserRouter, so any unknown path
#      must serve /index.html instead of 404. Without this, hard-refreshing
#      /predictions or /leaderboard breaks.
#   2. SSE pass-through — if the frontend ever proxies /api to the backend
#      (it doesn't in our setup; the React app talks directly to the
#      backend Cloud Run URL via VITE_API_URL), no buffering on event streams.
#      For our current setup this is unused but kept for reference.

server {
  listen 8080;
  server_name _;

  # Long cache on hashed static assets, no cache on the HTML shell.
  location / {
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — must come last so static files still serve directly.
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|svg|ico)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Health check for Cloud Run liveness probe
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
